name: Build APK
# Bygger en signerad APK vid varje push till main som ändrar appen, och på begäran.
# Hämta den från körningens sida: Actions -> körningen -> Artifacts.
on:
  push:
    branches: [main]
    paths: ['app/**', 'scripts/**', '.github/workflows/build-apk.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Install dependencies
        working-directory: app
        run: if [ -f package-lock.json ]; then npm ci; else npm install --no-audit --no-fund; fi
      - name: Keep the lock file
        uses: actions/upload-artifact@v4
        with:
          name: package-lock
          path: app/package-lock.json
          retention-days: 30
      - name: Type check and tests
        working-directory: app
        run: |
          npm run typecheck
          npm test
      - name: Generate Android project
        working-directory: app
        run: npx expo prebuild --platform android --no-install
      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            printf %s "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/ats.p12"
            echo "ATS_KEYSTORE_FILE=$RUNNER_TEMP/ats.p12" >> "$GITHUB_ENV"
          else
            echo "::warning::No signing key is stored (secret KEYSTORE_B64). This APK is signed with the public debug key."
          fi
      - name: Check the signing key
        if: env.ATS_KEYSTORE_FILE != ''
        env:
          ATS_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          [ -n "$ATS_KEYSTORE_PASSWORD" ] || { echo "::error::The secret KEYSTORE_PASSWORD is empty."; exit 1; }
          LIST=$(keytool -list -keystore "$ATS_KEYSTORE_FILE" -storetype PKCS12 -storepass:env ATS_KEYSTORE_PASSWORD 2>&1) || { echo "::error::The key file could not be opened: KEYSTORE_B64 is not the whole line, or KEYSTORE_PASSWORD is wrong."; exit 1; }
          printf %s "$LIST" | grep -qi "^ats," || { echo "::error::The alias ats was not found in the key file."; exit 1; }
          echo "Signing key OK."
      - name: Build release APK
        working-directory: app/android
        env:
          ATS_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          ATS_KEY_ALIAS: ats
          ATS_KEY_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          set -o pipefail
          if ! ./gradlew assembleRelease --no-daemon 2>&1 | tee "$RUNNER_TEMP/gradle.log"; then
            MSG=$(grep -A 15 -m 2 "What went wrong" "$RUNNER_TEMP/gradle.log" | head -40 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            [ -n "$MSG" ] || MSG=$(grep -iE "error:|e: " "$RUNNER_TEMP/gradle.log" | head -20 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Gradle build failed::$MSG"
            exit 1
          fi
      - name: Check the signature
        run: bash scripts/check-apk-signature.sh app/android/app/build/outputs/apk/release/app-release.apk
      - name: Name the APK
        id: name
        run: |
          VER=$(node -p "require('./app/package.json').version")
          echo "file=ATS-${VER}-${GITHUB_SHA::7}.apk" >> "$GITHUB_OUTPUT"
          cp app/android/app/build/outputs/apk/release/app-release.apk "ATS-${VER}-${GITHUB_SHA::7}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.name.outputs.file }}
          path: ${{ steps.name.outputs.file }}
          retention-days: 30
          if-no-files-found: error
