name: Release
# En release görs för en tagg vX.Y.Z, och automatiskt när versionen i app/package.json ändras på main.
# Releasen publiceras först NÄR APK:n är byggd och kontrollerad, med ATS-vX.Y.Z.apk och ATS.apk
# (appens uppdateringsfunktion behöver APK:n).
on:
  push:
    tags: ['v*']
    branches: [main]
    paths: ['app/package.json', '.github/workflows/release.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      build: ${{ steps.tag.outputs.build }}
    steps:
      - uses: actions/checkout@v4
      - name: Which version
        id: tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then TAG="${GITHUB_REF_NAME}"; else TAG="v$(node -p "require('./app/package.json').version")"; fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          APKS=$(gh release view "$TAG" --json assets -q '[.assets[].name | select(endswith(".apk"))] | length' 2>/dev/null || echo 0)
          if [ "${GITHUB_REF_TYPE}" != "tag" ] && [ "$APKS" != "0" ]; then echo "build=false" >> "$GITHUB_OUTPUT"; else echo "build=true" >> "$GITHUB_OUTPUT"; fi

  apk:
    needs: release
    if: needs.release.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Install dependencies
        working-directory: app
        run: if [ -f package-lock.json ]; then npm ci; else npm install --no-audit --no-fund; fi
      - name: Run tests
        working-directory: app
        run: npm test
      - name: Generate Android project
        working-directory: app
        run: npx expo prebuild --platform android --no-install
      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            printf %s "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/ats.p12"
            echo "ATS_KEYSTORE_FILE=$RUNNER_TEMP/ats.p12" >> "$GITHUB_ENV"
          else
            echo "::error::app/signing/cert-sha256.txt says releases are signed with the ATS key, but the secret KEYSTORE_B64 is missing."
            exit 1
          fi
      - name: Build release APK
        working-directory: app/android
        env:
          ATS_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          ATS_KEY_ALIAS: ats
          ATS_KEY_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          set -o pipefail
          if ! ./gradlew assembleRelease --no-daemon 2>&1 | tee "$RUNNER_TEMP/gradle.log"; then
            MSG=$(grep -A 15 -m 2 "What went wrong" "$RUNNER_TEMP/gradle.log" | head -40 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Gradle build failed::$MSG"
            exit 1
          fi
      - name: Check the signature
        run: bash scripts/check-apk-signature.sh app/android/app/build/outputs/apk/release/app-release.apk --require-own-key
      - name: Publish the release with the APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ needs.release.outputs.tag }}"
          cp app/android/app/build/outputs/apk/release/app-release.apk "ATS-${TAG}.apk"
          cp "ATS-${TAG}.apk" ATS.apk
          V="${TAG#v}"
          section() { awk -v v="## $V" 'index($0, v) == 1 {on=1; next} /^## / {on=0} on' "$1"; }
          { echo "<!-- lang:sv -->"; section CHANGELOG.md; echo; echo "<!-- lang:en -->"; section CHANGELOG.en.md; } > notes.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "ATS-${TAG}.apk" ATS.apk --clobber
            gh release edit "$TAG" --notes-file notes.md
          else
            gh release create "$TAG" "ATS-${TAG}.apk" ATS.apk --target "${GITHUB_SHA}" --title "ATS ${TAG}" --notes-file notes.md
          fi
